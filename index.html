<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Hazard & Monitoring System</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #status-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      position: relative;
    }

    #alert-banner {
      display: none;
      background-color: #d9534f;
      color: #fff;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      animation: blink 1s infinite;
      z-index: 1000;
      position: relative;
    }

    #location-warning-banner {
      display: none;
      background-color: #ff9800;
      color: #000;
      padding: 8px 15px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      z-index: 1000;
      position: relative;
    }

    @keyframes blink {
      50% { opacity: 0.5; }
    }

    #map {
      height: calc(100vh - 45px);
      width: 100vw;
    }

    .badge {
      font-weight: bold;
      color: #00ffcc;
    }

    /* Recenter Map Control Button */
    .recenter-btn {
      background-color: #ffffff;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }

    .recenter-btn:hover {
      background-color: #f4f4f4;
    }

    /* Custom Color-Coded Marker Styling */
    .custom-svg-marker {
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <div>Status: <span id="connection-status" class="badge">Connecting...</span></div>
    <div>Speed: <span id="speed-text" class="badge">0</span> km/h</div>
  </div>

  <div id="location-warning-banner">
    ⚠️ LOCATION DISABLED: Enable browser location permissions to transmit your real-time vehicle position.
  </div>

  <div id="alert-banner">
    ⚠️ WARNING: HAZARD DETECTED NEARBY!
  </div>

  <div id="map"></div>

  <!-- Socket.io and Leaflet JS -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const SPEED_LIMIT_KMH = 40;
    const socket = io({ transports: ["websocket", "polling"] });

    // Leaflet Map Initialization
    const map = L.map('map').setView([28.6139, 77.2090], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let myMarker = null;
    let myCoordinates = null;
    const otherVehicleMarkers = {};

    // Helper: Dynamic SVG Icon Generator (Green, Yellow, Red)
    function createVehicleIcon(color = "#28a745") {
      const svgIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <circle cx="12" cy="12" r="10" fill="${color}" stroke="#ffffff" stroke-width="2"/>
          <path d="M12 2L15 8H9L12 2Z" fill="#ffffff"/>
        </svg>`;
      
      return L.divIcon({
        className: "custom-svg-marker",
        html: svgIcon,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    // Helper: Pick Marker Color based on vehicle telemetry
    function getVehicleColor(v) {
      if (v.isProximityHazard) return "#dc3545"; // Red (Hazard)
      if (v.isOverspeeding) return "#ffc107";     // Yellow (Overspeeding)
      return "#28a745";                           // Green (Normal)
    }

    // Add Recenter Control Button to Leaflet UI
    const RecenterControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function() {
        const container = L.DomUtil.create('button', 'recenter-btn');
        container.innerHTML = "🎯 Recenter Map";
        container.onclick = function() {
          if (myCoordinates) {
            map.setView([myCoordinates.lat, myCoordinates.lng], 16);
          } else {
            alert("Location data is currently unavailable.");
          }
        };
        return container;
      }
    });
    map.addControl(new RecenterControl());

    // Socket Connection Status
    socket.on("connect", () => {
      const statusText = document.getElementById("connection-status");
      if (statusText) {
        statusText.innerText = `Connected (${socket.id.slice(0, 5)})`;
        statusText.style.color = "#00ffcc";
      }
    });

    socket.on("disconnect", () => {
      const statusText = document.getElementById("connection-status");
      if (statusText) {
        statusText.innerText = "Disconnected";
        statusText.style.color = "#ff4d4d";
      }
    });

    // Geolocation API & Error Warning Logic
    const locWarningBanner = document.getElementById("location-warning-banner");

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          locWarningBanner.style.display = "none";

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;

          myCoordinates = { lat, lng };

          const speedText = document.getElementById("speed-text");
          if (speedText) speedText.innerText = speed;

          if (myMarker) {
            myMarker.setLatLng([lat, lng]);
          } else {
            myMarker = L.marker([lat, lng], { icon: createVehicleIcon("#28a745") })
              .addTo(map)
              .bindPopup("Your Vehicle");
            map.setView([lat, lng], 16);
          }

          socket.emit("update_location", {
            lat,
            lng,
            speed,
            isOverspeeding: speed > SPEED_LIMIT_KMH
          });
        },
        (error) => {
          console.warn("Geolocation Warning:", error.message);
          locWarningBanner.style.display = "block";
          locWarningBanner.innerText = `⚠️ LOCATION ACCESS ERROR: ${error.message.toUpperCase()} (Enable location in browser settings)`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      locWarningBanner.style.display = "block";
      locWarningBanner.innerText = "⚠️ GEOLOCATION UNSUPPORTED: Your browser does not support GPS tracking.";
    }

    // Stream Active Vehicles & Dynamic UI Updates
    socket.on("vehicles_stream", (vehicles) => {
      const alertBanner = document.getElementById("alert-banner");
      let proximityHazardFound = false;
      let overspeedHazardFound = false;
      let hazardDistance = null;

      Object.keys(vehicles).forEach((id) => {
        const v = vehicles[id];
        if (v.isProximityHazard) {
          proximityHazardFound = true;
          hazardDistance = v.nearestVehicleDist;
        }
        if (v.isOverspeeding) {
          overspeedHazardFound = true;
        }
      });

      // Update Top Warning Banner
      if (alertBanner) {
        if (proximityHazardFound) {
          alertBanner.innerText = `⚠️ HAZARD WARNING: VEHICLE WITHIN ${hazardDistance || 50} METERS!`;
          alertBanner.style.display = "block";
        } else if (overspeedHazardFound) {
          alertBanner.innerText = `⚠️ SPEED WARNING: EXCEEDING ${SPEED_LIMIT_KMH} KM/H!`;
          alertBanner.style.display = "block";
        } else {
          alertBanner.style.display = "none";
        }
      }

      // Render & Color-Code Markers for Streamed Vehicles
      Object.keys(vehicles).forEach((id) => {
        if (id === socket.id && myMarker) {
          // Update local marker icon color if hazard occurs
          myMarker.setIcon(createVehicleIcon(getVehicleColor(vehicles[id])));
          return;
        }

        const v = vehicles[id];
        const iconColor = getVehicleColor(v);

        if (otherVehicleMarkers[id]) {
          otherVehicleMarkers[id].setLatLng([v.lat, v.lng]);
          otherVehicleMarkers[id].setIcon(createVehicleIcon(iconColor));
          otherVehicleMarkers[id].setPopupContent(`Vehicle ${id.slice(0, 4)} | ${v.speed} km/h`);
        } else {
          otherVehicleMarkers[id] = L.marker([v.lat, v.lng], { icon: createVehicleIcon(iconColor) })
            .addTo(map)
            .bindPopup(`Vehicle ${id.slice(0, 4)} | ${v.speed} km/h`);
        }
      });

      // Cleanup Disconnected Vehicles
      Object.keys(otherVehicleMarkers).forEach((id) => {
        if (!vehicles[id]) {
          map.removeLayer(otherVehicleMarkers[id]);
          delete otherVehicleMarkers[id];
        }
      });
    });
  </script>
</body>
</html>
