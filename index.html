<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Hazard & Monitoring System</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #status-bar {
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      position: relative;
    }

    #alert-banner {
      display: none;
      background-color: #d9534f;
      color: #fff;
      padding: 10px;
      text-align: center;
      font-weight: bold;
      animation: blink 1s infinite;
      z-index: 1000;
      position: relative;
    }

    @keyframes blink {
      50% { opacity: 0.5; }
    }

    #map {
      height: calc(100vh - 45px);
      width: 100vw;
    }

    .badge {
      font-weight: bold;
      color: #00ffcc;
    }
  </style>
</head>
<body>

  <div id="status-bar">
    <div>Status: <span id="connection-status" class="badge">Connecting...</span></div>
    <div>Speed: <span id="speed-text" class="badge">0</span> km/h</div>
  </div>

  <div id="alert-banner">
    ⚠️ WARNING: SPEED LIMIT EXCEEDED OR HAZARD NEARBY!
  </div>

  <div id="map"></div>

  <!-- Socket.io and Leaflet JS -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Socket.io Connection
    const socket = io({ transports: ["websocket", "polling"] });

    const statusText = document.getElementById("connection-status");
    const speedText = document.getElementById("speed-text");
    const alertBanner = document.getElementById("alert-banner");

    socket.on("connect", () => {
      statusText.innerText = `Connected (${socket.id.slice(0, 5)})`;
      statusText.style.color = "#00ffcc";
    });

    socket.on("disconnect", () => {
      statusText.innerText = "Disconnected";
      statusText.style.color = "#ff4d4d";
    });

    // 2. Leaflet Map Initialization
    const map = L.map('map').setView([20.5937, 78.9629], 5); // Default center (India)

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let myMarker = null;
    const otherVehicleMarkers = {};
    const SPEED_LIMIT_KMH = 40;

    // Helper: Haversine Formula for Distance (meters)
    function getDistanceInMeters(lat1 = 0, lon1 = 0, lat2 = 0, lon2 = 0) {
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
                
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 3. HTML5 Geolocation Tracking
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
          const isOverspeeding = speed > SPEED_LIMIT_KMH;

          speedText.innerText = speed;

          // Alert banner toggling
          if (isOverspeeding) {
            alertBanner.style.display = "block";
          } else {
            alertBanner.style.display = "none";
          }

          // Move current user marker
          if (myMarker) {
            myMarker.setLatLng([lat, lng]);
          } else {
            myMarker = L.marker([lat, lng]).addTo(map).bindPopup("Your Vehicle").openPopup();
            map.setView([lat, lng], 15);
          }

          // Emit telemetry to Node.js backend
          socket.emit("update_location", {
            lat,
            lng,
            speed,
            isOverspeeding
          });
        },
        (error) => console.error("GPS Error:", error.message),
        { enableHighAccuracy: true }
      );
    } else {
      alert("Geolocation is not supported by your browser.");
    }

    // 4. Stream Active Vehicles from Backend
    socket.on("vehicles_stream", (vehicles) => {
      Object.keys(vehicles).forEach((id) => {
        // Skip rendering our own socket connection via stream
        if (id === socket.id) return;

        const v = vehicles[id];

        if (otherVehicleMarkers[id]) {
          otherVehicleMarkers[id].setLatLng([v.lat, v.lng]);
        } else {
          otherVehicleMarkers[id] = L.marker([v.lat, v.lng])
            .addTo(map)
            .bindPopup(`Vehicle ${id.slice(0, 4)} | ${v.speed} km/h`);
        }
      });

      // Remove disconnected vehicle markers
      Object.keys(otherVehicleMarkers).forEach((id) => {
        if (!vehicles[id]) {
          map.removeLayer(otherVehicleMarkers[id]);
          delete otherVehicleMarkers[id];
        }
      });
    });
  </script>
</body>
</html>
